[setup]
BinaryPath="graphics\\LANDSCAPE_Korea_su\\ROADS\\Binary"
SystemPath="graphics\\LANDSCAPE_Korea_su\\ROADS"
Highways_LaneOffset=3.0
Generic_Load=0
MaxScanLOD=5
Map_Width=9984.0
Map_Height=9984.0
Map_ScaleFactor=50.0 
[end]
[3d_rails]

  // Road type, model, length
  // 0 - railroad
  // 1 - rails
  // 2 - railroad crossing
  [models]
  model=0,"graphics\\Blocks\\railroad.mgm",5.8
  model=1,"graphics\\Blocks\\rails.mgm",5.8
  model=2,"graphics\\Blocks\\railroad_crossing.mgm",10.6
  [end]

[end]

// Road type, texture, texture smooth, width, height for trains, max height
// texture file = SystemPath + "\\Textures\\railroadDistortion.bmp"
[distortion]
texture=0,"\\Textures\\railroadDistortion.bmp", "\\Textures\\railroadDistortionSmooth.bmp", 5.8, 0.25, 0.25
[end]


[Poles]
  // stump model name - model name + _stump
  
  // pole type 0
  [Pole]
    Model="graphics\\Blocks\\road_pole_0.mgm"
    Config="LuaScripts\\WorldObjects\\Trash\\PolesTrash\\PoleTrash_0.txt"
    SphereHitAccel=4.0
    LifeRate=2500.0
    BallisticsDurabilityK=0.4
    BreakAccel=900
    StandPoleMass=1000
  [end]
  
  
  // pole type 1
  [Pole]
    Model="graphics\\Blocks\\road_pole_1.mgm"
    Config="LuaScripts\\WorldObjects\\Trash\\PolesTrash\\PoleTrash_1.txt"
    SphereHitAccel=4.0
    LifeRate=2500.0
    BallisticsDurabilityK=0.4
    BreakAccel=900
    StandPoleMass=1000
  [end]
  
  [Params]
    RoadShift=7.0
    // texture file = SystemPath + "\\Textures\\wireTex."
    WireDiffTexture="graphics\\Textures\\Common\\wire.dds"
    WireNormTexture="graphics\\Textures\\Common\\wire_n.dds"
    WireMRRTexture="graphics\\Textures\\Common\\wire_MRR.dds"
    
    SoundBatchTrash="LuaScripts\\WorldObjects\\Trash\\ForestTrashSound.txt"
    SoundBatchBreak="LuaScripts\\WorldObjects\\Trash\\ForestBreakSound.txt"
  
    // Default collision  
    CollisionBody="graphics\\Blocks\\road_pole_0.col"
    
    PoleCollisionConvexName="col_road_pole"
    WireCollisionConvexName="col_wire"
    
    // Physical rope for broken poles
    RopeName="LuaScripts\\WorldObjects\\Ropes\\FlexRope50.txt"
    // RopeName="LuaScripts\\WorldObjects\\Ropes\\WireRope.txt"
  [end]
  

  
[end]
