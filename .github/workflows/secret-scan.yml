# Secret scanning with gitleaks on every push and pull request.
#
# The gitleaks CLI is run directly: gitleaks-action needs a paid licence for
# repositories owned by an organisation. The version is pinned.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.18.4
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan the history for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
