# Pre-commit hooks. Activate once per clone:
#   pip install pre-commit
#   pre-commit install
#
# No whitespace or end-of-file fixers: .Group fixtures are line-ending and
# byte sensitive (.gitattributes is `* -text`). No cargo fmt hook: the code is
# not formatted throughout, and a whole-file reformat would mix with real changes.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=10000"]
